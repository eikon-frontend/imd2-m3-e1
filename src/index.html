<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <article class="movie">
      <img class="movie-image" src="flow.jpg" alt="Un chat dans une barque, au milieu d'une forêt inondée.">
      <div class="movie-content">
        <div class="movie-intro">
          <header class="movie-heading">
            <p class="movie-tags">Animation · 1h25</p>
            <h1 class="movie-title">Flow</h1>
          </header>
          <p class="movie-text">Un chat solitaire voit son monde englouti par une crue et trouve refuge sur un bateau avec d'autres animaux. Une aventure sans un mot.</p>
        </div>
        <ul class="movie-times">
          <li>14:00</li>
          <li>16:30</li>
          <li>19:00</li>
          <li>21:15</li>
        </ul>
        <button class="movie-button" type="button">Réserver</button>
      </div>
    </article>
  </body>
</html>
